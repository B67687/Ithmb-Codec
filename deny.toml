[advisories]
ignore = [
    # paste 1.0.15 — unmaintained, transitive through rav1e→ravif→image
    # (image is a dev-dependency for golden-vector tests only — not a runtime concern)
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "ISC", "BSD-2-Clause", "BSD-3-Clause",
    "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "0BSD",
]

[bans]
multiple-versions = "deny"
wildcards = "warn"
skip = [
    # syn 2.x (clap_derive, thiserror-impl) and syn 3.x (async-trait via
    # wasm-bindgen-test) coexist as separate proc-macro graphs — benign.
    { name = "syn", version = "2" },
    { name = "syn", version = "3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Explicit crates.io allowlist per dependency-management-standard Rule 12 /
# Supply-Chain control 3 (trusted sources + integrity). Denies all other registries/git.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
