[workspace]
resolver = "2"
members = ["crates/ithmb-core", "pymod", "crates/ithmb-cli", "crates/ithmb-gen", "crates/ithmb-wasm"]
exclude = ["fuzz"]

[workspace.package]
version = "1.9.9"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/B67687/Ithmb-Codec"
homepage = "https://github.com/B67687/Ithmb-Codec"
documentation = "https://docs.rs/ithmb-core"
description = "Rust codec for Apple IThmb thumbnail files (iPod/iPhone PhotoDB)"

[workspace.lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "deny"
perf = "deny"
style = "deny"
pedantic = "deny"

# CI/DEV PROFILE — strip DWARF from dependencies only. Dependencies are never
# debugged (backtraces inside zune-jpeg/clap/pyo3 are useless), so their debug
# info is pure waste in target/ and on every dev/CI compile. Own crates keep
# full debug=2 so panic backtraces + gdb/lldb on the unsafe SIMD/C-API code
# remain intact. See ADR-0008.
#
# NOTE: "*" also matches workspace members, so each own crate is explicitly
# re-enabled below. profile.test inherits profile.dev automatically.
[profile.dev.package."*"]
debug = false
[profile.dev.package.ithmb-core]
debug = true
[profile.dev.package.ithmb-cli]
debug = true
[profile.dev.package.ithmb-gen]
debug = true
[profile.dev.package.ithmb-wasm]
debug = true
[profile.dev.package.ithmb-python]
debug = true
