# ci-full.yml — EXPENSIVE full suite, ONLY on push/merge to main.
# PRs get the fast checks (pr-checks.yml); the 3-OS build matrix, fuzz,
# benchmarks, wasm, and C-API build run here, when code actually lands.
# Keeps CI minutes low on PRs while main is always fully verified.
name: ci-full
on:
  push: { branches: [main] }
permissions: { contents: read }

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
          cache: true
          cache-key: "rust-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml') }}"
      - name: Build
        shell: bash
        run: |
          exclude=""
          if [ "${{ matrix.os }}" = "macos-latest" ]; then exclude='--exclude ithmb-python'; fi
          cargo build --workspace $exclude
      - name: Build with logging feature
        shell: bash
        run: cargo build --features logging -p ithmb-core
      - name: Test
        shell: bash
        env:
          RUST_BACKTRACE: 1
        run: |
          exclude=""
          if [ "${{ matrix.os }}" = "macos-latest" ]; then exclude='--exclude ithmb-python'; fi
          cargo test --workspace $exclude

  benchmark_regression:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
          cache-key: "bench-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('.github/baseline.json') }}"
      - name: Benchmark regression check
        env:
          FAIL_THRESHOLD: 1.25
        shell: bash
        run: |
          tools/check-benchmark-regression.sh
      - name: Upload CI benchmark data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-benchmark-data
          path: /tmp/ci-benchmark-output.txt
          retention-days: 7
  fuzz:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
          cache-key: "fuzz-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('fuzz/Cargo.toml') }}"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --debug --locked --version 0.13.2 2>&1 | tail -3
      - name: Fuzz decode_ithmb
        run: cargo fuzz run fuzz_decode_ithmb -- -max_total_time=30 2>&1 | tail -5
        working-directory: ./fuzz
      - name: Fuzz open_ithmb
        run: cargo fuzz run fuzz_open_ithmb -- -max_total_time=30 2>&1 | tail -5
        working-directory: ./fuzz
      - name: Fuzz encode roundtrip
        run: cargo fuzz run fuzz_encode_roundtrip -- -max_total_time=30 2>&1 | tail -5
        working-directory: ./fuzz
      - name: Upload fuzz crash artifacts (reproducers)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          retention-days: 14

  build_c_api:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
          cache-key: "c-api-${{ hashFiles('rust-toolchain.toml') }}"
      - name: Build with c feature
        run: cargo build -p ithmb-core --features c
      - name: Verify C symbols are exported
        run: nm -D target/debug/libithmb_core.so | grep -E 'ithmb_decode|ithmb_prefix_to_profile'
      - name: Run C API integration test
        run: cargo test -p ithmb-core --features c --test c_api_test

  wasm:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-unknown-unknown
          cache: true
          cache-key: "wasm-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('crates/ithmb-wasm/Cargo.toml') }}"
      - name: Install wasm-pack
        run: |
          cargo install wasm-pack --locked --version 0.12.1
      - name: Build wasm
        shell: bash
        run: wasm-pack build crates/ithmb-wasm/
